<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Driver Portal')}"></head>
<body>

<nav th:replace="~{fragments/common :: sidebar('driver-dashboard')}"></nav>
<div class="main-wrapper">
    <nav th:replace="~{fragments/common :: navbar('Driver Portal')}"></nav>
    
    <div class="content-area">
        <div class="fade-in">
            <div class="mb-4">
                <h4 class="fw-bold">Welcome, <span th:text="${#authentication.name}" class="text-primary">Driver</span>!</h4>
                <p class="text-muted">Here are your assigned deliveries for today.</p>
            </div>

            <div class="row g-4">
                <!-- If no deliveries -->
                <div th:if="${#lists.isEmpty(deliveries)}" class="col-12">
                    <div class="card bg-light border-0 py-5 text-center">
                        <div class="card-body">
                            <i class="bi bi-cup-hot text-muted mb-3" style="font-size: 3rem;"></i>
                            <h5>No assigned deliveries right now.</h5>
                            <p class="text-muted">Take a break, we'll notify you when new assignments arrive.</p>
                        </div>
                    </div>
                </div>

                <!-- Delivery Cards -->
                <div th:each="delivery : ${deliveries}" class="col-md-6 col-xl-4">
                    <div class="card h-100 shadow-sm border-0">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                            <span class="fw-bold text-primary" th:text="${'#DEL-' + delivery.deliveryId}">#DEL-1</span>
                            <span class="badge" th:classappend="'bg-' + ${#strings.toLowerCase(delivery.status)}" th:text="${delivery.status}">ASSIGNED</span>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title fw-bold mb-3" th:text="${delivery.customerName}">Customer Name</h5>
                            
                            <div class="d-flex mb-3">
                                <i class="bi bi-geo-alt text-danger me-3 fs-5 mt-1"></i>
                                <div>
                                    <div class="small text-muted fw-semibold">Delivery Address</div>
                                    <div th:text="${delivery.customerAddress}">123 Address St.</div>
                                </div>
                            </div>
                            
                            <div class="d-flex mb-3" th:if="${delivery.routeStartLocation != null}">
                                <i class="bi bi-map text-primary me-3 fs-5 mt-1"></i>
                                <div>
                                    <div class="small text-muted fw-semibold">Route Info</div>
                                    <div class="small">From: <span th:text="${delivery.routeStartLocation}">Start</span></div>
                                    <div class="small" th:if="${delivery.routeEstimatedTime != null}">Est: <span th:text="${delivery.routeEstimatedTime}">30 min</span></div>
                                </div>
                            </div>
                            
                            <div class="d-flex">
                                <i class="bi bi-box me-3 fs-5 mt-1 text-secondary"></i>
                                <div>
                                    <div class="small text-muted fw-semibold">Package Details</div>
                                    <div class="small">Weight: <span th:text="${delivery.packageWeight}">5</span> kg</div>
                                    <div class="small fst-italic mt-1" th:if="${delivery.notes != null and !delivery.notes.isEmpty()}" th:text="${'Note: ' + delivery.notes}"></div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-white border-top p-3 d-flex gap-2">
                            <button th:if="${delivery.status != null && delivery.status.name() == 'ASSIGNED'}" type="button" class="btn btn-primary w-100 fw-semibold" th:onclick="'updateStatus(' + ${delivery.deliveryId} + ', \'OUT_FOR_DELIVERY\')'">
                                <i class="bi bi-truck me-2"></i>Start Delivery
                            </button>
                            <button th:if="${delivery.status != null && delivery.status.name() == 'OUT_FOR_DELIVERY'}" type="button" class="btn btn-success w-100 fw-semibold" th:onclick="'updateStatus(' + ${delivery.deliveryId} + ', \'DELIVERED\')'">
                                <i class="bi bi-check2-circle me-2"></i>Mark Delivered
                            </button>
                            <button th:if="${delivery.status != null && delivery.status.name() == 'DELIVERED'}" type="button" class="btn btn-light w-100 text-success fw-semibold" disabled>
                                <i class="bi bi-check-lg me-2"></i>Completed
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
<script>
    function updateStatus(id, newStatus) {
        if(!confirm('Are you sure you want to update the status to ' + newStatus + '?')) return;
        
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/driver/deliveries/' + id + '/status';
        
        const statusInput = document.createElement('input');
        statusInput.type = 'hidden';
        statusInput.name = 'status';
        statusInput.value = newStatus;
        
        form.appendChild(statusInput);
        document.body.appendChild(form);
        form.submit();
    }
</script>
</body>
</html>
