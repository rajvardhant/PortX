<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Routes Directory')}"></head>
<body>

<nav th:replace="~{fragments/common :: sidebar('routes')}"></nav>
<div class="main-wrapper">
    <nav th:replace="~{fragments/common :: navbar('Routes Directory')}"></nav>
    
    <div class="content-area">
        <div class="fade-in">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <div>
                    <h4 class="fw-bold mb-0">Routes</h4>
                    <p class="text-muted small mb-0">Optimized delivery routes, OpenRouteService distances, and estimated travel times.</p>
                </div>
                <a th:href="@{/admin/routes/new}" class="btn btn-primary shadow-sm fw-semibold">
                    <i class="bi bi-plus-lg me-2"></i>Calculate Route
                </a>
            </div>

            <!-- Filter Tab Pills Bar -->
            <div class="filter-tab-group mb-3">
                <button type="button" class="btn filter-tab active" data-filter="all">
                    <i class="bi bi-grid-fill me-1"></i>All <span class="badge bg-secondary bg-opacity-25 text-secondary ms-1">0</span>
                </button>
                <button type="button" class="btn filter-tab" data-filter="ACTIVE">
                    <i class="bi bi-check-circle-fill text-success me-1"></i>Active <span class="badge bg-success bg-opacity-25 text-success ms-1">0</span>
                </button>
                <button type="button" class="btn filter-tab" data-filter="COMPLETED">
                    <i class="bi bi-flag-fill text-primary me-1"></i>Completed <span class="badge bg-primary bg-opacity-25 text-primary ms-1">0</span>
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-transparent p-3 border-bottom d-flex justify-content-between align-items-center">
                    <div class="input-group" style="max-width: 340px; width: 100%;">
                        <span class="input-group-text border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control border-start-0 table-search-input" placeholder="Search routes by start, end location...">
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Start Location</th>
                                    <th>End Location</th>
                                    <th>Distance (km)</th>
                                    <th>Est. Duration</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="route : ${routes}" 
                                    th:attr="data-status=${route.status}">
                                    <td class="ps-4 fw-bold" th:text="${route.routeId}">1</td>
                                    <td class="fw-bold" th:text="${route.startLocation}">Mumbai</td>
                                    <td class="fw-bold" th:text="${route.endLocation}">Pune</td>
                                    <td class="fw-extrabold text-primary" th:text="${route.distance + ' km'}">150.5 km</td>
                                    <td class="fw-medium" th:text="${route.estimatedTime}">3 hrs 15 mins</td>
                                    <td>
                                        <span class="badge" th:classappend="${route.status.name() == 'ACTIVE' ? 'bg-delivered' : 'bg-pending'}" th:text="${route.status}">ACTIVE</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="action-btn-group">
                                            <form th:action="@{/admin/routes/{id}/delete(id=${route.routeId})}" method="post" class="d-inline m-0" onsubmit="return confirm('Are you sure you want to delete this route?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" data-bs-toggle="tooltip" title="Delete">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(routes)}" class="empty-table-row">
                                    <td colspan="7" class="text-center py-5 text-muted">
                                        <i class="bi bi-map fs-1 d-block mb-3"></i>
                                        No routes found. Click 'Calculate Route' to create one.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
