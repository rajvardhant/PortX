<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Drivers Management')}"></head>
<body>

<nav th:replace="~{fragments/common :: sidebar('drivers')}"></nav>
<div class="main-wrapper">
    <nav th:replace="~{fragments/common :: navbar('Drivers Management')}"></nav>
    
    <div class="content-area">
        <div class="fade-in">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <div>
                    <h4 class="fw-bold mb-0">Drivers</h4>
                    <p class="text-muted small mb-0">Manage driver profiles, portal logins, and vehicle assignments.</p>
                </div>
                <a th:href="@{/admin/drivers/new}" class="btn btn-primary shadow-sm fw-semibold">
                    <i class="bi bi-plus-lg me-2"></i>Add Driver
                </a>
            </div>

            <!-- Filter Tab Pills Bar -->
            <div class="filter-tab-group mb-3">
                <button type="button" class="btn filter-tab active" data-filter="all">
                    <i class="bi bi-grid-fill me-1"></i>All <span class="badge bg-secondary bg-opacity-25 text-secondary ms-1">0</span>
                </button>
                <button type="button" class="btn filter-tab" data-filter="AVAILABLE">
                    <i class="bi bi-check-circle-fill text-success me-1"></i>Available <span class="badge bg-success bg-opacity-25 text-success ms-1">0</span>
                </button>
                <button type="button" class="btn filter-tab" data-filter="ON_DUTY">
                    <i class="bi bi-truck text-primary me-1"></i>On Duty <span class="badge bg-primary bg-opacity-25 text-primary ms-1">0</span>
                </button>
                <button type="button" class="btn filter-tab" data-filter="OFF_DUTY">
                    <i class="bi bi-slash-circle text-warning me-1"></i>Off Duty <span class="badge bg-warning bg-opacity-25 text-warning ms-1">0</span>
                </button>
                <button type="button" class="btn filter-tab" data-filter="WITH_VEHICLE">
                    <i class="bi bi-truck-front-fill me-1"></i>With Vehicle <span class="badge bg-info bg-opacity-25 text-info ms-1">0</span>
                </button>
                <button type="button" class="btn filter-tab" data-filter="WITHOUT_VEHICLE">
                    <i class="bi bi-person-x me-1"></i>Without Vehicle <span class="badge bg-secondary bg-opacity-25 text-secondary ms-1">0</span>
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-transparent p-3 border-bottom d-flex justify-content-between align-items-center">
                    <div class="input-group" style="max-width: 340px; width: 100%;">
                        <span class="input-group-text border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control border-start-0 table-search-input" placeholder="Search drivers by name, phone, license...">
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Name</th>
                                    <th>Login Account</th>
                                    <th>Phone</th>
                                    <th>License No</th>
                                    <th>Vehicle</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="driver : ${drivers}" 
                                    th:attr="data-status=${driver.status}, data-has-vehicle=${driver.vehicleId != null}">
                                    <td class="ps-4 fw-bold" th:text="${driver.driverId}">1</td>
                                    <td class="fw-bold" th:text="${driver.name}">John Doe</td>
                                    <td>
                                        <span th:if="${driver.userUsername != null}" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2 py-1">
                                            <i class="bi bi-person-check me-1"></i><span th:text="${driver.userUsername}">driver1</span>
                                        </span>
                                        <span th:if="${driver.userUsername == null}" class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-25 px-2 py-1">
                                            <i class="bi bi-person-x me-1"></i>No Login Account
                                        </span>
                                    </td>
                                    <td class="fw-medium" th:text="${driver.phone}">+1 234 567 890</td>
                                    <td class="fw-medium" th:text="${driver.licenseNumber}">LIC-1234</td>
                                    <td class="fw-medium" th:text="${driver.vehicleRegistrationNumber != null ? driver.vehicleRegistrationNumber : 'Not Assigned'}">Not Assigned</td>
                                    <td>
                                        <span class="badge" th:classappend="${driver.status.name() == 'AVAILABLE' ? 'bg-delivered' : (driver.status.name() == 'ON_DUTY' ? 'bg-out_for_delivery' : 'bg-pending')}" th:text="${driver.status}">AVAILABLE</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="action-btn-group">
                                            <a th:href="@{/admin/drivers/{id}/edit(id=${driver.driverId})}" class="btn btn-sm btn-outline-primary" data-bs-toggle="tooltip" title="Edit">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/admin/drivers/{id}/delete(id=${driver.driverId})}" method="post" class="d-inline m-0" onsubmit="return confirm('Are you sure you want to delete this driver?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" data-bs-toggle="tooltip" title="Delete">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(drivers)}" class="empty-table-row">
                                    <td colspan="8" class="text-center py-5 text-muted">
                                        <i class="bi bi-person-x fs-1 d-block mb-3"></i>
                                        No drivers found. Click 'Add Driver' to create one.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
