<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - 403</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .error-container { min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .error-card { background: white; padding: 4rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; max-width: 500px; width: 100%; }
        .icon { font-size: 6rem; margin-bottom: 1rem; line-height: 1; }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-card">
        <div class="icon">🔒</div>
        <h1 class="display-4 fw-bold text-danger mb-3">403</h1>
        <h3 class="fw-bold mb-3">Access Denied</h3>
        <p class="text-muted mb-4">Oops! You don't have the necessary permissions to view this page or perform this action.</p>
        <a href="/" class="btn btn-primary px-4 py-2 rounded-pill fw-semibold">Return to Dashboard</a>
    </div>
</div>
</body>
</html>
