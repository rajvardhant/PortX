# Application
spring.application.name=Dynamic Route Optimization System
server.port=8080

# ─────────────────────────────────────────
# MySQL Database Configuration
# Update username and password to match your MySQL setup
# ─────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/routedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────
# JPA / Hibernate
# ddl-auto=update: auto-creates/updates tables on startup
# ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Enable OpenEntityManagerInView to allow lazy loading in web rendering
spring.jpa.open-in-view=true

# ─────────────────────────────────────────
# Seed data (data.sql) configuration
# Data initialization disabled — seed data is handled by DataInitializer.java
# DataInitializer uses the real BCryptPasswordEncoder, which is safer than data.sql hashes
spring.sql.init.mode=never

# ─────────────────────────────────────────
# Thymeleaf
# ─────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ─────────────────────────────────────────
# JWT Configuration
# Secret must be a Base64-encoded 256-bit key
# ─────────────────────────────────────────
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ─────────────────────────────────────────
