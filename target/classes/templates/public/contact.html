<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | PortX</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<!-- Header Navigation -->
<nav class="navbar navbar-expand-lg sticky-top border-bottom shadow-sm py-3" style="background-color: var(--navbar-bg);">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-extrabold fs-3" href="/" style="color: var(--text-main);">
            <i class="bi bi-truck text-indigo" style="color: #4f46e5;"></i>
            <span>PortX</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-semibold">
                <li class="nav-item"><a class="nav-link px-3" href="/" style="color: var(--text-main);">Home</a></li>
                <li class="nav-item"><a class="nav-link px-3" href="/services" style="color: var(--text-main);">Services</a></li>
                <li class="nav-item"><a class="nav-link px-3" href="/about" style="color: var(--text-main);">About Us</a></li>
                <li class="nav-item"><a class="nav-link text-primary active px-3" href="/contact">Contact</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <button class="theme-toggle-btn me-1" title="Toggle Light/Dark Theme">
                    <i class="bi bi-moon-stars-fill theme-toggle-icon"></i>
                </button>
                <a href="/login" class="btn btn-primary fw-semibold px-4 rounded-pill shadow-sm">Portal Login</a>
            </div>
        </div>
    </div>
</nav>

<section class="py-5" style="background-color: var(--body-bg);">
    <div class="container py-4 text-center">
        <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill fw-semibold mb-2">Support</span>
        <h1 class="display-5 fw-extrabold mb-3">Get in Touch with PortX</h1>
        <p class="text-muted col-md-7 mx-auto lead">Have questions about your delivery, enterprise logistics, or driver partnerships? We're here to help.</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row g-5 justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 p-4">
                    <div class="card-body">
                        <h4 class="fw-bold mb-4">Send Us a Message</h4>
                        <form onsubmit="alert('Thank you! Your message has been sent to PortX Support.'); return false;">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Your Name</label>
                                    <input type="text" class="form-control" required placeholder="e.g. Amit Kumar">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Email Address</label>
                                    <input type="email" class="form-control" required placeholder="e.g. amit@example.com">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Subject</label>
                                    <input type="text" class="form-control" required placeholder="General Inquiry / Support">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Message</label>
                                    <textarea class="form-control" rows="4" required placeholder="Write your message here..."></textarea>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">Send Message</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white py-4 text-center">
    <div class="container">
        <p class="mb-0 text-white-50">&copy; 2026 PortX Logistics. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
