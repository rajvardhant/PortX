<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Deliveries Management')}"></head>
<body>

<nav th:replace="~{fragments/common :: sidebar('deliveries')}"></nav>
<div class="main-wrapper">
    <nav th:replace="~{fragments/common :: navbar('Deliveries Management')}"></nav>
    
    <div class="content-area">
        <div class="fade-in">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h4 class="fw-bold mb-0">Deliveries</h4>
                <a th:href="@{/dispatcher/deliveries/new}" class="btn btn-primary shadow-sm fw-semibold">
                    <i class="bi bi-plus-lg me-2"></i>Create Delivery
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-transparent p-3 border-bottom d-flex justify-content-between align-items-center">
                    <div class="input-group" style="max-width: 340px; width: 100%;">
                        <span class="input-group-text border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control border-start-0 table-search-input" placeholder="Search deliveries by customer, address, driver, status...">
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Customer</th>
                                    <th>Address</th>
                                    <th>Weight (kg)</th>
                                    <th>Driver</th>
                                    <th>Vehicle</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="delivery : ${deliveries}">
                                    <td class="ps-4 fw-bold text-primary" th:text="${'#DEL-' + delivery.deliveryId}">#DEL-1</td>
                                    <td>
                                        <div class="fw-semibold" th:text="${delivery.customerName}">John Doe</div>
                                    </td>
                                    <td th:text="${delivery.customerAddress}">123 Main St</td>
                                    <td class="fw-medium" th:text="${delivery.packageWeight}">15.5</td>
                                    <td>
                                        <span th:if="${delivery.driverName != null}" class="fw-bold" th:text="${delivery.driverName}">Driver Name</span>
                                        <span th:if="${delivery.driverName == null}" class="text-muted fst-italic">Unassigned</span>
                                    </td>
                                    <td>
                                        <span th:text="${delivery.vehicleRegistrationNumber != null ? delivery.vehicleRegistrationNumber : 'None'}" class="badge bg-secondary bg-opacity-10 text-secondary border">MH01AB1234</span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="'bg-' + ${#strings.toLowerCase(delivery.status)}" th:text="${delivery.status}">PENDING</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="action-btn-group">
                                            <a th:href="@{/dispatcher/deliveries/{id}/edit(id=${delivery.deliveryId})}" class="btn btn-sm btn-outline-primary" data-bs-toggle="tooltip" title="Edit">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/dispatcher/deliveries/{id}/delete(id=${delivery.deliveryId})}" method="post" class="d-inline m-0" onsubmit="return confirm('Are you sure you want to delete this delivery?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" data-bs-toggle="tooltip" title="Delete">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(deliveries)}" class="empty-table-row">
                                    <td colspan="8" class="text-center py-5 text-muted">
                                        <i class="bi bi-box-seam fs-1 d-block mb-3"></i>
                                        No deliveries found. Click 'Create Delivery' to start.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
