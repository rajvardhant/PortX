<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PortX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .login-split { min-height: 100vh; }
        .login-left { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; display: flex; flex-direction: column; justify-content: center; padding: 4rem; }
        .login-right { display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .login-card { width: 100%; max-width: 500px; background: white; border-radius: 1.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); padding: 3rem; }
        .form-control, .form-select { padding: 0.8rem 1.2rem; border-radius: 0.75rem; background-color: #f1f5f9; border: 1px solid transparent; }
        .form-control:focus, .form-select:focus { background-color: white; border-color: #6366f1; box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25); }
        .btn-primary { background: linear-gradient(90deg, #6366f1, #8b5cf6); border: none; padding: 0.8rem; border-radius: 0.75rem; font-weight: 600; }
    </style>
</head>
<body>
<div class="row g-0 login-split">
    <div class="col-lg-5 d-none d-lg-flex login-left">
        <div class="mb-5"><i class="bi bi-truck display-1"></i></div>
        <h1 class="display-4 fw-bold mb-4">PortX Route System</h1>
        <p class="lead opacity-75 mb-5">Create a new user account.</p>
    </div>
    <div class="col-lg-7 login-right">
        <div class="login-card">
            <h3 class="fw-bold mb-4 text-center">Register New User</h3>
            
            <div th:if="${successMsg}" class="alert alert-success rounded-3" th:text="${successMsg}"></div>
            <div th:if="${errorMsg}" class="alert alert-danger rounded-3" th:text="${errorMsg}"></div>

            <form th:action="@{/admin/register}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">Full Name</label>
                    <input type="text" class="form-control" name="fullName" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">Username</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">Email Address</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Role</label>
                    <select class="form-select" name="role" required>
                        <option value="DISPATCHER">Dispatcher</option>
                        <option value="DRIVER">Driver</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-person-plus me-2"></i>Create Account
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
