<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Delivery History')}"></head>
<body>

<nav th:replace="~{fragments/common :: sidebar('driver-history')}"></nav>
<div class="main-wrapper">
    <nav th:replace="~{fragments/common :: navbar('Driver Delivery History')}"></nav>
    
    <div class="content-area">
        <div class="fade-in">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h4 class="fw-bold mb-0">Completed Shipments</h4>
                    <p class="text-muted small mb-0">Record of all successfully completed deliveries.</p>
                </div>
                <a th:href="@{/driver/dashboard}" class="btn btn-primary fw-semibold">
                    <i class="bi bi-speedometer2 me-2"></i>Active Portal
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th class="ps-4">Delivery ID</th>
                                    <th>Customer Name</th>
                                    <th>Address</th>
                                    <th>Weight (kg)</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Completed Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="delivery : ${completedDeliveries}">
                                    <td class="ps-4 fw-bold text-primary" th:text="${'#DEL-' + delivery.deliveryId}">#DEL-1</td>
                                    <td class="fw-bold" th:text="${delivery.customerName}">John Smith</td>
                                    <td class="small text-muted" th:text="${delivery.customerAddress}">Address</td>
                                    <td class="fw-medium" th:text="${delivery.packageWeight + ' kg'}">10 kg</td>
                                    <td><span class="badge bg-delivered">DELIVERED</span></td>
                                    <td class="text-end pe-4 small fw-medium" th:text="${#temporals.format(delivery.updatedAt, 'MMM dd, yyyy HH:mm')}">Oct 01, 2026</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(completedDeliveries)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="bi bi-clock-history fs-1 d-block mb-3"></i>
                                        No completed delivery history found.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
