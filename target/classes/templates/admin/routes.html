<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Routes Management')}"></head>
<body>

<nav th:replace="~{fragments/common :: sidebar('routes')}"></nav>
<div class="main-wrapper">
    <nav th:replace="~{fragments/common :: navbar('Routes Management')}"></nav>
    
    <div class="content-area">
        <div class="fade-in">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h4 class="fw-bold mb-0">Routes</h4>
                <a th:href="@{/admin/routes/new}" class="btn btn-primary shadow-sm fw-semibold">
                    <i class="bi bi-plus-lg me-2"></i>Generate Route
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-transparent p-3 border-bottom d-flex justify-content-between align-items-center">
                    <div class="input-group" style="max-width: 340px; width: 100%;">
                        <span class="input-group-text border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control border-start-0 table-search-input" placeholder="Search routes by origin, destination, distance...">
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Start Location</th>
                                    <th>End Location</th>
                                    <th>Distance</th>
                                    <th>Est. Time</th>
                                    <th>Created Date</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="route : ${routes}">
                                    <td class="ps-4 fw-bold" th:text="${route.routeId}">1</td>
                                    <td class="fw-medium" th:text="${route.startLocation}">Origin</td>
                                    <td class="fw-medium" th:text="${route.endLocation}">Destination</td>
                                    <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(route.distance, 1, 2) + ' km'}">10 km</td>
                                    <td class="fw-medium" th:text="${route.estimatedTime}">30 mins</td>
                                    <td th:text="${route.createdAt != null ? #temporals.format(route.createdAt, 'MMM dd, yyyy HH:mm') : '-'}">Oct 01, 2026</td>
                                    <td class="text-end pe-4">
                                        <div class="action-btn-group">
                                            <form th:action="@{/admin/routes/{id}/delete(id=${route.routeId})}" method="post" class="d-inline m-0" onsubmit="return confirm('Are you sure you want to delete this route?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" data-bs-toggle="tooltip" title="Delete">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(routes)}" class="empty-table-row">
                                    <td colspan="7" class="text-center py-5 text-muted">
                                        <i class="bi bi-map fs-1 d-block mb-3"></i>
                                        No routes found. Click 'Generate Route' to create one.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
