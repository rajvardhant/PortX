<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Vehicles Management')}"></head>
<body>

<nav th:replace="~{fragments/common :: sidebar('vehicles')}"></nav>
<div class="main-wrapper">
    <nav th:replace="~{fragments/common :: navbar('Vehicles Management')}"></nav>
    
    <div class="content-area">
        <div class="fade-in">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h4 class="fw-bold mb-0">Vehicles</h4>
                <a th:href="@{/admin/vehicles/new}" class="btn btn-primary shadow-sm fw-semibold">
                    <i class="bi bi-plus-lg me-2"></i>Add Vehicle
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-transparent p-3 border-bottom d-flex justify-content-between align-items-center">
                    <div class="input-group" style="max-width: 340px; width: 100%;">
                        <span class="input-group-text border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control border-start-0 table-search-input" placeholder="Search vehicles by registration, type, status...">
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Registration No</th>
                                    <th>Type</th>
                                    <th>Capacity (kg)</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="vehicle : ${vehicles}">
                                    <td class="ps-4 fw-bold" th:text="${vehicle.vehicleId}">1</td>
                                    <td class="fw-bold" th:text="${vehicle.registrationNumber}">REG-123</td>
                                    <td class="fw-medium" th:text="${vehicle.vehicleType}">TRUCK</td>
                                    <td class="fw-medium" th:text="${vehicle.capacity}">5000</td>
                                    <td>
                                        <span class="badge" th:classappend="${vehicle.status != null && vehicle.status.name() == 'AVAILABLE' ? 'bg-delivered' : (vehicle.status != null && vehicle.status.name() == 'MAINTENANCE' ? 'bg-pending' : 'bg-out_for_delivery')}" th:text="${vehicle.status}">AVAILABLE</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="action-btn-group">
                                            <a th:href="@{/admin/vehicles/{id}/edit(id=${vehicle.vehicleId})}" class="btn btn-sm btn-outline-primary" data-bs-toggle="tooltip" title="Edit">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/admin/vehicles/{id}/delete(id=${vehicle.vehicleId})}" method="post" class="d-inline m-0" onsubmit="return confirm('Are you sure you want to delete this vehicle?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" data-bs-toggle="tooltip" title="Delete">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(vehicles)}" class="empty-table-row">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="bi bi-truck-flatbed fs-1 d-block mb-3"></i>
                                        No vehicles found. Click 'Add Vehicle' to create one.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
