<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${dispatcherRequest.id == null ? 'Add Dispatcher' : 'Edit Dispatcher'})}"></head>
<body>

<nav th:replace="~{fragments/common :: sidebar('dispatchers')}"></nav>
<div class="main-wrapper">
    <nav th:replace="~{fragments/common :: navbar(${dispatcherRequest.id == null ? 'Add New Dispatcher' : 'Edit Dispatcher'})}"></nav>
    
    <div class="content-area">
        <div class="fade-in">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white p-4 border-bottom">
                            <h5 class="mb-0 fw-bold" th:text="${dispatcherRequest.id == null ? 'Add New Dispatcher Account' : 'Edit Dispatcher Account'}">Add New Dispatcher</h5>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/admin/dispatchers/save}" th:object="${dispatcherRequest}" method="post">
                                <input type="hidden" th:field="*{id}" />
                                
                                <div class="row g-4">
                                    <div class="col-md-6">
                                        <label for="fullName" class="form-label fw-semibold">Full Name *</label>
                                        <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="e.g. John Dispatcher" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="email" class="form-label fw-semibold">Email Address *</label>
                                        <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="dispatcher@portx.com" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="username" class="form-label fw-semibold">Login Username *</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                                            <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="e.g. dispatcher2" required>
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="password" class="form-label fw-semibold">Login Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                                            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Set password (e.g. admin123)">
                                        </div>
                                        <div class="form-text text-muted small">Leave blank when editing to keep current password.</div>
                                    </div>
                                </div>
                                
                                <div class="mt-5 d-flex gap-3">
                                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-2"></i>Save Dispatcher</button>
                                    <a th:href="@{/admin/dispatchers}" class="btn btn-light px-4">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
